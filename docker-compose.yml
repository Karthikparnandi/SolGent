services:
  backend:
    build:
      context: ./solgent-backend
      dockerfile: Dockerfile
    image: solgent-backend:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./solgent-backend/.env
    environment:
      PORT: "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  frontend:
    build:
      context: ./solgent-frontend
      dockerfile: Dockerfile
    image: solgent-frontend:latest
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M