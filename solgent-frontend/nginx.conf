server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: Vite/React Router client-side routes (e.g. /dashboard)
    # have no matching file on disk. Without this, a hard refresh on any
    # non-root route returns Nginx's default 404 instead of your app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed build assets (Vite fingerprints filenames), but
    # never cache index.html itself — otherwise a deploy can leave users
    # stuck on a stale index.html pointing at JS bundles that no longer
    # exist on the server.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}